# Scheduled data jobs. Rebuilds and deploys only when a job reports changed data.
# Cron lines must match SCHEDULES in scripts/ingest/index.ts. Times are UTC (IST = UTC+5:30).
name: ingest
on:
  schedule:
    - cron: '17,47 * * * *' # videos + news, every 30 min
    - cron: '5 1 * * *'     # AIFF youth leagues, 06:35 IST
    - cron: '35 18 * * *'   # 00:05 IST: refresh every fixture list + rebuild
    - cron: '*/5 * * * *'   # match-day gate: league data is fetched only while a match is in play
  workflow_dispatch:
    inputs:
      job:
        description: Job to run
        type: choice
        options: [all, videos, news, isl, aiff-ifl, youth, karnataka]
        default: all
concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  # Cheap check (no npm install): which leagues have a match between 15 min before kickoff and 2 h 30 after it?
  gate:
    if: github.event.schedule == '*/5 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      leagues: ${{ steps.gate.outputs.leagues }}
    steps:
      - uses: actions/checkout@v7
        with: { sparse-checkout: scripts/ingest/gate.mjs, sparse-checkout-cone-mode: false }
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - id: gate
        run: node scripts/ingest/gate.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  run:
    needs: gate
    # Gate ticks only continue when a league is in play; every other schedule (and manual runs) skips the gate and runs as before.
    if: ${{ !cancelled() && (needs.gate.result == 'skipped' || needs.gate.outputs.leagues != '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency: { group: deploy-production, cancel-in-progress: false }
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      YT_API_KEY: ${{ secrets.YT_API_KEY }}
      # Until the secrets exist the job still fetches (a free health check of every source) but does not deploy.
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # Create the Neon tables if missing (idempotent), then restore the latest data so this run merges with earlier runs.
      - run: npm run db:migrate
      - run: npm run snapshots:pull
      - id: ingest
        run: npm run ingest -- --schedule "${{ github.event.schedule }}" --job "${{ inputs.job || 'auto' }}" ${{ needs.gate.outputs.leagues != '' && format('--leagues "{0}"', needs.gate.outputs.leagues) || '' }}
        continue-on-error: true # a failed source still lets the others deploy; the run is marked below
      - if: steps.ingest.outputs.changed == 'true'
        run: npm run build
      - if: steps.ingest.outputs.changed == 'true' && env.HAS_CF == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=panenkagoal --branch=main
      - if: steps.ingest.outcome == 'failure'
        run: |
          echo "::error::One or more ingest jobs failed. See the ingest step log."
          exit 1
