# Scheduled data jobs. Rebuilds and deploys only when a job reports changed data.
# Cron lines must match SCHEDULES in scripts/ingest/index.ts. Times are UTC (IST = UTC+5:30).
name: ingest
on:
  schedule:
    - cron: '17,47 * * * *' # videos + news, every 30 min
    - cron: '5 1 * * *'     # AIFF youth leagues, 06:35 IST
    - cron: '35 18 * * *'   # 00:05 IST: refresh every fixture list + rebuild
    # Match-day runs are dispatched by the Cloudflare Worker in workers/match-gate (every 5 min, only while a match is in play).
  workflow_dispatch:
    inputs:
      job:
        description: Job to run
        type: choice
        options: [all, videos, news, isl, aiff-ifl, youth, karnataka]
        default: all
      leagues:
        description: Comma-separated league slugs to fetch live (set by the match-gate Worker)
        type: string
        default: ''
concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency: { group: deploy-production, cancel-in-progress: false }
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      YT_API_KEY: ${{ secrets.YT_API_KEY }}
      # Until the secrets exist the job still fetches (a free health check of every source) but does not deploy.
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # Create the Neon tables if missing (idempotent), then restore the latest data so this run merges with earlier runs.
      - run: npm run db:migrate
      - run: npm run snapshots:pull
      - id: ingest
        # A non-empty leagues input (from the Worker) takes precedence over the job choice: only those leagues are fetched.
        run: npm run ingest -- --schedule "${{ github.event.schedule }}" --job "${{ inputs.job || 'auto' }}" ${{ inputs.leagues != '' && format('--leagues "{0}"', inputs.leagues) || '' }}
        continue-on-error: true # a failed source still lets the others deploy; the run is marked below
      - if: steps.ingest.outputs.changed == 'true'
        run: npm run build
      - if: steps.ingest.outputs.changed == 'true' && env.HAS_CF == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=panenkagoal --branch=main
      - if: steps.ingest.outcome == 'failure'
        run: |
          echo "::error::One or more ingest jobs failed. See the ingest step log."
          exit 1
